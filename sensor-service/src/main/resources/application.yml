server:
  port: ${SERVER_PORT:3002}

spring:
  application:
    name: sensor-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agrosense}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: sensores
        jdbc:
          time_zone: UTC

# URL de GestionService para verificar cultivos
services:
  gestion:
    url: ${GESTION_SERVICE_URL:http://localhost:3001}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
